<!doctype html>
<html lang="fr">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audit local du portfolio</title>
  <style>
    body {
      font: 14px/1.6 system-ui;
      margin: 20px;
      background: #edf2f7;
      color: #152030;
    }
    iframe {
      width: 100%;
      height: 740px;
      border: 1px solid #bac5d1;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <h1>Audit d’accessibilité local</h1>
  <p>
    Outil de développement uniquement, exclu du build de production. Les
    résultats automatisés complètent les vérifications visuelles et clavier.
  </p>
  <button id="run" disabled>Analyser avec axe-core</button>
  <pre id="result" aria-live="polite">Chargement du portfolio…</pre>
  <iframe id="site" title="Portfolio à analyser" src="/"></iframe>
  <script type="module">
    import axe from "axe-core";
    const frame = document.querySelector("#site");
    const run = document.querySelector("#run");
    const result = document.querySelector("#result");
    function ready() {
      const script = frame.contentDocument.createElement("script");
      script.textContent = axe.source;
      frame.contentDocument.head.append(script);
      run.disabled = false;
      result.textContent = "Prêt pour l’analyse.";
    }
    frame.addEventListener("load", ready);
    if (frame.contentDocument.readyState === "complete") ready();
    run.addEventListener("click", async () => {
      run.disabled = true;
      try {
        const audit = await frame.contentWindow.axe.run(frame.contentDocument, {
          runOnly: {
            type: "tag",
            values: ["wcag2a", "wcag2aa", "wcag21aa", "best-practice"],
          },
        });
        result.textContent = JSON.stringify(
          {
            passes: audit.passes.length,
            violations: audit.violations.map((v) => ({
              id: v.id,
              impact: v.impact,
              description: v.description,
              nodes: v.nodes.map((n) => ({
                target: n.target,
                summary: n.failureSummary,
              })),
            })),
            incomplete: audit.incomplete.map((v) => ({
              id: v.id,
              nodes: v.nodes.length,
            })),
          },
          null,
          2,
        );
      } catch (error) {
        result.textContent = error.message;
      }
      run.disabled = false;
    });
  </script>
</html>
